<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <h1 class="title">Classic Snake Game</h1>
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- Start & Restart Buttons -->
      <div class="game-buttons">
        <button onclick="startGame()" id="startBtn">▶️ Start</button>
        <button onclick="restartGame()">🔄 Restart</button>
        <button onclick="togglePause()" id="pauseBtn">⏸️ Pause</button>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button onclick="setDirectionByButton('UP')">⬆️</button>
        <div>
          <button onclick="setDirectionByButton('LEFT')">⬅️</button>
          <button onclick="setDirectionByButton('DOWN')">⬇️</button>
          <button onclick="setDirectionByButton('RIGHT')">➡️</button>
        </div>
      </div>

      <!-- Audio files -->
      <audio id="bgMusic" src="music.mp3" loop></audio>
      <audio id="moveSound" src="move.mp3"></audio>
      <audio id="foodSound" src="food.mp3"></audio>
      <audio id="gameOverSound" src="gameover.mp3"></audio>

      <script src="script.js"></script>
    </div>
</body>

</html>
